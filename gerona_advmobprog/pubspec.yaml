name: gerona_advmobprog
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_screenutil: ^5.9.3
  http: ^1.5.0
  provider: ^6.1.5

flutter:
  assets:
    - assets/
    - assets/images/
    - assets/.env
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
  uses-material-design: true


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0